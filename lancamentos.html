<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registrar Lançamento — MEI Fácil</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <a href="index.html" class="voltar">← Voltar</a>
        <h1 id="tituloPagina">Novo Lançamento</h1>
      </header>

      <form id="formLancamento" class="formulario">
        <div class="grupo-form">
          <label for="descricao">Descrição</label>
          <input
            type="text"
            id="descricao"
            placeholder="Ex: Venda de pães"
            required
          />
        </div>

        <div class="grupo-form">
          <label for="valor">Valor (R$)</label>
          <input
            type="number"
            step="0.01"
            id="valor"
            placeholder="0,00"
            required
          />
        </div>

        <div class="grupo-form">
          <label for="data">Data</label>
          <input type="date" id="data" required />
        </div>

        <div class="grupo-form" id="campoTipo">
          <label>Categoria</label>
          <select id="categoria">
            <option value="">Selecione...</option>
          </select>
        </div>

        <button type="submit" class="btn btn-principal btn-full">
          ✅ Salvar
        </button>
      </form>
    </div>
    <script src="script.js"></script>
  </body>
</html>
